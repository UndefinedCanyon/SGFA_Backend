name: CD (Azure)

# Despliega a la VM de Azure al hacer push a main (o a mano desde la pestaña Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: despliegue-azure
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    name: Construir y publicar la imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dueño en minúsculas
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/sgfa-backend:latest
            ghcr.io/${{ env.OWNER }}/sgfa-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desplegar:
    name: Desplegar en la VM
    needs: imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Copiar archivos de despliegue
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ vars.VM_USER || 'azureuser' }}
        run: |
          tar czf - -C deploy . -C "$GITHUB_WORKSPACE" database \
            | ssh -i ~/.ssh/vm_key "$VM_USER@$VM_HOST" "mkdir -p ~/sgfa && tar xzf - -C ~/sgfa"

      - name: Actualizar los contenedores
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ vars.VM_USER || 'azureuser' }}
        run: |
          ssh -i ~/.ssh/vm_key "$VM_USER@$VM_HOST" '
            set -e
            cd ~/sgfa
            test -f .env || { echo "Falta ~/sgfa/.env en la VM"; exit 1; }
            docker compose -f docker-compose.prod.yml pull backend
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
          '
