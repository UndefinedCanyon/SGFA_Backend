name: CI

on:
  push:
    branches: [desarrollo, preproduccion, main]
  pull_request:
    branches: [desarrollo, preproduccion, main]

jobs:
  pruebas:
    name: Pruebas de arquitectura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Dar permiso de ejecución a mvnw
        run: chmod +x mvnw
      - name: Verificar que los scripts SQL fijan la codificación
        run: |
          for f in database/*.sql; do
            if [ "$(head -n 1 "$f" | tr -d '\r')" != "SET NAMES utf8mb4;" ]; then
              echo "La primera línea de $f debe ser: SET NAMES utf8mb4;"
              exit 1
            fi
          done
      - name: Ejecutar pruebas de arquitectura
        run: ./mvnw -B test -Dtest=ArquitecturaHexagonalTest

  imagen:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v7

      - name: Construir imagen del backend
        run: docker build -t sgfa-backend:${{ github.sha }} .