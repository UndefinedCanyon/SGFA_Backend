name: CI

on:
  push:
    branches: [desarrollo, preproduccion, main]
  pull_request:
    branches: [desarrollo, preproduccion, main]

jobs:
  pruebas:
    name: Pruebas de arquitectura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Dar permiso de ejecución a mvnw
        run: chmod +x mvnw

      - name: Ejecutar pruebas de arquitectura
        run: ./mvnw -B test -Dtest=ArquitecturaHexagonalTest

  imagen:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v7

      - name: Construir imagen del backend
        run: docker build -t sgfa-backend:${{ github.sha }} .